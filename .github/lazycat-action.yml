version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: grimmory
build:
  toolchains: []
  run_buildscript: false
images:
  - id: grimmory
    target: service
    service: grimmory
    source: ghcr.io/grimmory-tools/grimmory
    channel: custom
    sort: semver
    tag_regex: ^v[0-9]+[.][0-9]+[.][0-9]+$
    version_regex: ^v(?P<version>[0-9]+[.][0-9]+[.][0-9]+)$
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: mariadb
    target: service
    service: mariadb
    source: linuxserver/mariadb
    channel: custom
    sort: semver
    tag_regex: ^11[.]4[.]8$
    version_regex: "^(?P<version>11[.]4[.]8)$"
    version_template: "{version}"
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Grimmory
    skip_if_version_exists: true
